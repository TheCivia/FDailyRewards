name: FDailyRewards
version: '${version}'
main: com.fretka46.fDailyRewards.FDailyRewards
api-version: '26.3'
authors: [ fretka46 ]
prefix: FDailyRewards
description: Daily rewards plugin for TheCivia
# join-classpath: plugin importuje nebo reflexí načítá třídy těchto pluginů
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  fdailyrewards.reload:
    default: op
  fdailyrewards.admin.resetday:
    default: op
  fdailyrewards.admin.setday:
    default: op
  fdailyrewards.admin.giftday:
    default: op
  fdailyrewards.admin.giftnext:
    default: op
  fdailyrewards.admin.checkday:
    default: op
  fdailyrewards.admin.unlockmissed:
    default: op
  fdailyrewards.admin.setvip:
    default: op
  fdailyrewards.admin.givepass:
    default: op
  fdailyrewards.admin.removepass:
    default: op
  fdailyrewards.admin.passinfo:
    default: op
  fdailyrewards.admin.pending:
    default: op
  fdailyrewards.admin.preview:
    default: op
  fdailyrewards.bypass.antialt:
    description: Obejde bránu proti altům (limit účtů z jedné IP a minimální odehraný čas)
    default: false
